name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Traer el código del repositorio
      uses: actions/checkout@v7

      - name: Instalar uv
      uses: astral-sh/setup-uv@v9.0.0

      - name: Instalar el proyecto y sus dependencias
      run: uv sync --locked

      - name: Revisar el estilo con ruff
      run: uv run ruff check
      
      - name: Correr las pruebas
      run: uv run pytest