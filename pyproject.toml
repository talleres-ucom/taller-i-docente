[project]
name = "arandu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "linriquelme-tech", email = "linda.riquelme@uc.edu.py" }
]
requires-python = ">=3.14"
dependencies = []

